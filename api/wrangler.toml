name = "calendar-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 23 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "calendar-db"
database_id = "559a678a-dffc-445b-b8a6-7852d33e4dbf"

[ai]
binding = "AI"

# Vectorize binding（本番時に有効化）
# 有効化手順:
#   1. wrangler vectorize create calendar-memory-index --dimensions=768 --metric=cosine
#   2. 以下のコメントを外す
# [[vectorize]]
# binding = "VECTORIZE_INDEX"
# index_name = "calendar-memory-index"
